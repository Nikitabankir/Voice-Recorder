
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:30px 16px;
  display:flex;justify-content:center;align-items:center;
  background:radial-gradient(circle at top,#29204d,#090914 65%);
  color:white;font-family:Arial,sans-serif;
}
.app{
  width:100%;max-width:520px;padding:30px;
  background:#171525;border:1px solid #393052;
  border-radius:25px;box-shadow:0 20px 70px #0008;
  text-align:center;
}
h1{margin:0 0 8px;font-size:30px}
.sub{color:#aaa;margin-bottom:30px}
.mic{
  width:120px;height:120px;border:0;border-radius:50%;
  background:linear-gradient(145deg,#a855f7,#6d28d9);
  color:white;font-size:45px;cursor:pointer;
  box-shadow:0 0 35px #9333ea66;transition:.2s;
}
.mic:hover{transform:scale(1.06)}
.mic.recording{background:#e04465;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px #e0446522}}
#timer{font-size:32px;margin:20px 0 8px;font-variant-numeric:tabular-nums}
#status{color:#aaa;font-size:14px;min-height:36px}
.buttons{display:flex;gap:10px;margin-top:25px}
button.secondary{
  flex:1;padding:13px;border:1px solid #51436e;
  background:#29233b;color:white;border-radius:12px;
  cursor:pointer;font-size:15px;
}
button:disabled{opacity:.4;cursor:not-allowed}
.download{display:inline-block;color:#c084fc;margin-top:22px}
.note{color:#888;font-size:12px;margin-top:25px;line-height:1.5}
</style>
</head>
<body>
<main class="app">
  <h1>🎙️ Voice Recorder</h1>
  <div class="sub">Запиши голос и послушай наоборот!</div>

  <button class="mic" id="mic">🎤</button>
  <div id="timer">00:00</div>
  <div id="status">Нажми на микрофон и говори</div>

  <div class="buttons">
    <button class="secondary" id="stop" disabled>⏹ Остановить</button>
    <button class="secondary" id="reverse" disabled>⏪ Послушать наоборот</button>
  </div>

  <a id="download" class="download" hidden download="my-recording.webm">⬇ Скачать оригинальную запись</a>

  <div class="note">
    Говори в микрофон, останови запись и нажми «Послушать наоборот».
    Расшифровки в текст нет.
  </div>
</main>

<script>
const mic = document.getElementById("mic");
const stopBtn = document.getElementById("stop");
const reverseBtn = document.getElementById("reverse");
const timer = document.getElementById("timer");
const status = document.getElementById("status");
const download = document.getElementById("download");

let recorder = null;
let stream = null;
let chunks = [];
let audioBlob = null;
let audioURL = null;
let seconds = 0;
let clock = null;
let audioContext = null;
let playbackSource = null;
let reversedBuffer = null;

function showTime() {
  const m = String(Math.floor(seconds / 60)).padStart(2, "0");
  const s = String(seconds % 60).padStart(2, "0");
  timer.textContent = m + ":" + s;
}

function stopPlayback() {
  if (playbackSource) {
    try { playbackSource.stop(); } catch(e) {}
    playbackSource = null;
  }
}

mic.addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") return;

  try {
    stopPlayback();

    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      status.textContent = "Открой сайт в современном Chrome или Edge.";
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    audioBlob = null;
    reversedBuffer = null;
    seconds = 0;
    showTime();

    if (audioURL) URL.revokeObjectURL(audioURL);
    audioURL = null;
    download.hidden = true;
    reverseBtn.disabled = true;

    let options = {};
    if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
      options.mimeType = "audio/webm;codecs=opus";
    }

    recorder = new MediaRecorder(stream, options);

    recorder.ondataavailable = (event) => {
      if (event.data && event.data.size > 0) chunks.push(event.data);
    };

    recorder.onstop = () => {
      audioBlob = new Blob(chunks, {
        type: recorder.mimeType || "audio/webm"
      });

      audioURL = URL.createObjectURL(audioBlob);
      download.href = audioURL;
      download.hidden = false;
      reverseBtn.disabled = false;
      status.textContent = "Запись готова! Теперь слушай её наоборот.";

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    };

    recorder.start();

    mic.classList.add("recording");
    mic.textContent = "⏺";
    stopBtn.disabled = false;
    status.textContent = "Идёт запись — говори в микрофон...";

    clock = setInterval(() => {
      seconds++;
      showTime();
    }, 1000);

  } catch(error) {
    status.textContent = "Не удалось включить микрофон. Разреши доступ в браузере.";
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
  }
});

stopBtn.addEventListener("click", () => {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
  }

  clearInterval(clock);
  mic.classList.remove("recording");
  mic.textContent = "🎤";
  stopBtn.disabled = true;
  status.textContent = "Обрабатываю запись...";
});

reverseBtn.addEventListener("click", async () => {
  if (!audioBlob) return;

  try {
    stopPlayback();
    status.textContent = "Готовлю обратное воспроизведение...";

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      status.textContent = "Браузер не поддерживает обработку аудио.";
      return;
    }

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    await audioContext.resume();

    if (!reversedBuffer) {
      const data = await audioBlob.arrayBuffer();
      const original = await audioContext.decodeAudioData(data);

      const reversed = audioContext.createBuffer(
        original.numberOfChannels,
        original.length,
        original.sampleRate
      );

      for (let channel = 0; channel < original.numberOfChannels; channel++) {
        const input = original.getChannelData(channel);
        const output = reversed.getChannelData(channel);

        for (let i = 0; i < input.length; i++) {
          output[i] = input[input.length - 1 - i];
        }
      }

      reversedBuffer = reversed;
    }

    const source = audioContext.createBufferSource();
    source.buffer = reversedBuffer;
    source.connect(audioContext.destination);

    playbackSource = source;

    source.onended = () => {
      if (playbackSource === source) {
        playbackSource = null;
        status.textContent = "Обратное воспроизведение завершено!";
      }
    };

    source.start();
    status.textContent = "⏪ Твой голос звучит задом наперёд!";

  } catch(error) {
    status.textContent = "Не удалось обработать аудио. Попробуй записать ещё раз.";
  }
});
</script>
</body>
</html>
